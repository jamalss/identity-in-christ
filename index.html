<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Am In Christ — Identity Affirmations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --dawn-void:#14132B;
    --dusk-plum:#3D2A4C;
    --ember:#E85D3D;
    --amber:#F4A93B;
    --sunglow:#FFE3B0;
    --paper:#FFF8EE;
    --ink:#2B1B22;
    --ink-soft:#6b5a5e;
    --line:rgba(255,227,176,0.18);
    --max:860px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    font-family:'Manrope',sans-serif;
    color:var(--sunglow);
    background:var(--dawn-void);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  ::selection{background:var(--ember);color:var(--paper);}

  /* ---------- SKY / HERO ---------- */
  .sky{
    position:relative;
    overflow:hidden;
    padding:64px 24px 40px;
    background:
      radial-gradient(ellipse 120% 80% at 50% 115%, var(--amber) 0%, var(--ember) 22%, var(--dusk-plum) 52%, var(--dawn-void) 78%);
    text-align:center;
  }
  .sunburst{
    position:absolute;
    left:50%;
    bottom:-10%;
    width:900px;
    max-width:220vw;
    height:900px;
    transform:translateX(-50%);
    opacity:0.55;
    animation:spin 120s linear infinite;
    pointer-events:none;
  }
  @keyframes spin{ to{ transform:translateX(-50%) rotate(360deg); } }
  @media (prefers-reduced-motion:reduce){ .sunburst{ animation:none; } }

  .sun-disc{
    position:absolute;
    left:50%;
    bottom:-70px;
    width:150px;
    height:150px;
    transform:translateX(-50%);
    border-radius:50%;
    background:radial-gradient(circle at 40% 35%, #FFF3D6, var(--amber) 55%, var(--ember) 100%);
    box-shadow:0 0 90px 20px rgba(244,169,59,0.55);
  }

  .eyebrow{
    position:relative;
    z-index:2;
    font-size:12px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color:var(--sunglow);
    opacity:0.75;
    font-weight:700;
    margin:0 0 18px;
  }
  h1{
    position:relative;
    z-index:2;
    font-family:'Fraunces',serif;
    font-weight:500;
    font-style:italic;
    font-size:clamp(2.4rem, 6vw, 4.2rem);
    line-height:1.05;
    margin:0 0 14px;
    color:#fff;
    text-shadow:0 2px 30px rgba(0,0,0,0.25);
  }
  .sub{
    position:relative;
    z-index:2;
    max-width:520px;
    margin:0 auto;
    font-size:15px;
    line-height:1.6;
    color:var(--sunglow);
    opacity:0.85;
  }

  /* ---------- TABS ---------- */
  nav.tabs{
    position:sticky;
    top:0;
    z-index:20;
    display:flex;
    justify-content:center;
    gap:4px;
    background:rgba(20,19,43,0.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
    padding:10px 12px;
  }
  nav.tabs button{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.04em;
    background:none;
    border:none;
    color:var(--sunglow);
    opacity:0.55;
    padding:10px 18px;
    cursor:pointer;
    border-radius:999px;
    transition:opacity .2s, background .2s, color .2s;
  }
  nav.tabs button:hover{opacity:0.85;}
  nav.tabs button.active{
    opacity:1;
    background:linear-gradient(135deg, var(--ember), var(--amber));
    color:#1a1310;
  }
  nav.tabs button:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible{
    outline:2px solid var(--amber);
    outline-offset:2px;
  }

  main{max-width:var(--max); margin:0 auto; padding:40px 20px 90px;}
  section{display:none;}
  section.active{display:block; animation:fadeUp .35s ease both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}
  @media (prefers-reduced-motion:reduce){ section.active{animation:none;} }

  /* ---------- CARD (shared) ---------- */
  .card{
    background:var(--paper);
    color:var(--ink);
    border-radius:22px;
    padding:40px 34px;
    box-shadow:0 20px 60px rgba(0,0,0,0.35);
    position:relative;
    overflow:hidden;
  }
  .card::before{
    content:"";
    position:absolute;
    top:-40%; right:-20%;
    width:260px; height:260px;
    background:radial-gradient(circle, rgba(232,93,61,0.13), transparent 70%);
    pointer-events:none;
  }
  .lead-tag{
    display:inline-block;
    font-family:'Manrope',sans-serif;
    font-weight:800;
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ember);
    background:rgba(232,93,61,0.1);
    padding:6px 12px;
    border-radius:999px;
    margin-bottom:18px;
  }
  .stmt{
    font-family:'Fraunces',serif;
    font-weight:500;
    font-size:clamp(1.4rem, 3.4vw, 2.05rem);
    line-height:1.32;
    margin:0 0 22px;
  }
  .ref{
    font-size:13.5px;
    font-weight:700;
    color:var(--ink-soft);
    letter-spacing:0.02em;
  }

  /* ---------- MEDITATE ---------- */
  #meditate .card{min-height:280px; display:flex; flex-direction:column; justify-content:center;}
  .med-controls{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-top:28px;
  }
  .med-controls button{
    font-family:'Manrope',sans-serif;
    font-weight:700;
    font-size:13px;
    border:1px solid var(--line);
    background:rgba(255,227,176,0.06);
    color:var(--sunglow);
    padding:11px 20px;
    border-radius:12px;
    cursor:pointer;
    transition:background .2s, transform .15s;
  }
  .med-controls button:hover{background:rgba(255,227,176,0.14);}
  .med-controls button:active{transform:scale(0.96);}
  .med-controls button.primary{
    background:linear-gradient(135deg, var(--ember), var(--amber));
    color:#1a1310;
    border:none;
  }
  .med-count{
    text-align:center;
    font-size:12px;
    color:var(--sunglow);
    opacity:0.6;
    margin-top:10px;
    letter-spacing:0.04em;
  }

  .arc-wrap{margin:34px auto 0; max-width:420px;}
  .arc-wrap svg{width:100%; height:auto; display:block;}

  /* ---------- BROWSE ---------- */
  .browse-controls{
    display:flex;
    flex-direction:column;
    gap:14px;
    margin-bottom:26px;
  }
  #search{
    width:100%;
    font-family:'Manrope',sans-serif;
    font-size:15px;
    padding:14px 18px;
    border-radius:14px;
    border:1px solid var(--line);
    background:rgba(255,227,176,0.06);
    color:var(--sunglow);
  }
  #search::placeholder{color:rgba(255,227,176,0.45);}
  .filter-row{display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
  .chip{
    font-family:'Manrope',sans-serif;
    font-size:12.5px;
    font-weight:700;
    padding:8px 14px;
    border-radius:999px;
    border:1px solid var(--line);
    background:transparent;
    color:var(--sunglow);
    opacity:0.65;
    cursor:pointer;
    transition:all .2s;
  }
  .chip:hover{opacity:0.9;}
  .chip.active{
    opacity:1;
    background:var(--sunglow);
    color:var(--dawn-void);
    border-color:var(--sunglow);
  }
  select#bookFilter{
    font-family:'Manrope',sans-serif;
    font-size:12.5px;
    font-weight:700;
    padding:9px 12px;
    border-radius:10px;
    border:1px solid var(--line);
    background:var(--dawn-void);
    color:var(--sunglow);
  }
  .result-count{
    font-size:12px;
    color:var(--sunglow);
    opacity:0.55;
    margin:2px 2px 18px;
  }
  .grid{display:grid; grid-template-columns:1fr; gap:14px;}
  .grid .card{padding:24px 26px;}
  .grid .stmt{font-size:1.08rem; margin-bottom:10px;}
  .grid .lead-tag{margin-bottom:10px;}
  .empty-state{
    text-align:center;
    padding:60px 20px;
    color:var(--sunglow);
    opacity:0.55;
    font-size:14px;
  }

  /* ---------- TODAY ---------- */
  #today .card{text-align:center;}
  #today .date{
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--ink-soft);
    font-weight:800;
    margin-bottom:16px;
  }
  #today .stmt{font-size:clamp(1.6rem, 4vw, 2.3rem);}
  .today-note{
    text-align:center;
    font-size:12.5px;
    color:var(--sunglow);
    opacity:0.55;
    margin-top:20px;
  }
  .today-note button{
    background:none; border:none; color:var(--amber);
    font-weight:700; cursor:pointer; text-decoration:underline;
    font-family:'Manrope',sans-serif; font-size:12.5px;
    padding:0;
  }

  footer{
    text-align:center;
    padding:36px 20px 50px;
    font-size:12px;
    color:var(--sunglow);
    opacity:0.4;
    letter-spacing:0.03em;
  }

  @media (max-width:520px){
    .card{padding:28px 22px;}
    .med-controls{flex-wrap:wrap;}
  }
</style>
</head>
<body>

<div class="sky">
  <svg class="sunburst" viewBox="0 0 900 900" aria-hidden="true">
    <g stroke="#FFE3B0" stroke-width="1.4" opacity="0.5">
      <!-- rays generated via JS below is overkill; static set is fine -->
    </g>
  </svg>
  <div class="sun-disc" aria-hidden="true"></div>
  <p class="eyebrow">A study in identity</p>
  <h1>I Am In Christ</h1>
  <p class="sub">Every line here is a truth Scripture already says about you. Not a mood, not a mantra — a record. Read slowly.</p>
</div>

<nav class="tabs" role="tablist" aria-label="Study modes">
  <button class="active" data-tab="meditate" role="tab" aria-selected="true">Meditate</button>
  <button data-tab="browse" role="tab" aria-selected="false">Browse</button>
  <button data-tab="today" role="tab" aria-selected="false">Today</button>
</nav>

<main>

  <!-- MEDITATE -->
  <section id="meditate" class="active">
    <div class="card">
      <span class="lead-tag" id="medLead">I am</span>
      <p class="stmt" id="medStmt">Loading…</p>
      <p class="ref" id="medRef"></p>
    </div>
    <div class="med-controls">
      <button id="medPrev">← Prev</button>
      <button id="medShuffle">Shuffle</button>
      <button id="medNext" class="primary">Next →</button>
    </div>
    <p class="med-count" id="medCount"></p>
    <div class="arc-wrap">
      <svg viewBox="0 0 400 130" aria-hidden="true">
        <path d="M 20 120 A 180 180 0 0 1 380 120" fill="none" stroke="rgba(255,227,176,0.18)" stroke-width="2"/>
        <path id="arcFill" d="M 20 120 A 180 180 0 0 1 380 120" fill="none" stroke="url(#arcGrad)" stroke-width="2" stroke-dasharray="565" stroke-dashoffset="565"/>
        <circle id="arcDot" cx="20" cy="120" r="7" fill="#FFE3B0"/>
        <defs>
          <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#E85D3D"/>
            <stop offset="100%" stop-color="#F4A93B"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
  </section>

  <!-- BROWSE -->
  <section id="browse">
    <div class="browse-controls">
      <input type="text" id="search" placeholder="Search a word, a feeling, a reference…">
      <div class="filter-row" id="leadChips"></div>
      <div class="filter-row">
        <select id="bookFilter"><option value="">All books</option></select>
      </div>
    </div>
    <p class="result-count" id="resultCount"></p>
    <div class="grid" id="grid"></div>
  </section>

  <!-- TODAY -->
  <section id="today">
    <div class="card">
      <p class="date" id="todayDate"></p>
      <span class="lead-tag" id="todayLead">I am</span>
      <p class="stmt" id="todayStmt">Loading…</p>
      <p class="ref" id="todayRef"></p>
    </div>
    <p class="today-note">One truth a day, same for everyone who opens this today. <button id="toBrowse">See them all →</button></p>
  </section>

</main>

<footer>I Am In Christ — a study of identity, drawn from Scripture.</footer>

/* ---------- shared helpers ---------- */
function renderCard(item, elLead, elStmt, elRef){
  elLead.textContent = item.lead;
  elStmt.textContent = item.text;
  elRef.textContent = item.ref;
}

/* ---------- TABS ---------- */
const tabButtons = document.querySelectorAll('nav.tabs button');
const sections = document.querySelectorAll('main section');
function setTab(name){
  tabButtons.forEach(b => {
    const on = b.dataset.tab === name;
    b.classList.toggle('active', on);
    b.setAttribute('aria-selected', on);
  });
  sections.forEach(s => s.classList.toggle('active', s.id === name));
}
tabButtons.forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
document.getElementById('toBrowse').addEventListener('click', () => setTab('browse'));

/* ---------- MEDITATE ---------- */
let medIndex = 0;
let medOrder = DATA.map((_, i) => i);

function renderMed(){
  const item = DATA[medOrder[medIndex]];
  renderCard(item, document.getElementById('medLead'), document.getElementById('medStmt'), document.getElementById('medRef'));
  document.getElementById('medCount').textContent = (medIndex + 1) + ' of ' + DATA.length;
  const pct = medIndex / (DATA.length - 1);
  const arcLen = 565;
  const offset = arcLen - (arcLen * pct);
  document.getElementById('arcFill').setAttribute('stroke-dashoffset', offset);
  const path = document.getElementById('arcFill');
  const pt = path.getPointAtLength(arcLen * pct);
  document.getElementById('arcDot').setAttribute('cx', pt.x);
  document.getElementById('arcDot').setAttribute('cy', pt.y);
}
document.getElementById('medNext').addEventListener('click', () => {
  medIndex = (medIndex + 1) % DATA.length;
  renderMed();
});
document.getElementById('medPrev').addEventListener('click', () => {
  medIndex = (medIndex - 1 + DATA.length) % DATA.length;
  renderMed();
});
document.getElementById('medShuffle').addEventListener('click', () => {
  for(let i = medOrder.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [medOrder[i], medOrder[j]] = [medOrder[j], medOrder[i]];
  }
  medIndex = 0;
  renderMed();
});
document.addEventListener('keydown', (e) => {
  if(!document.getElementById('meditate').classList.contains('active')) return;
  if(e.key === 'ArrowRight') document.getElementById('medNext').click();
  if(e.key === 'ArrowLeft') document.getElementById('medPrev').click();
});

/* ---------- BROWSE ---------- */
const leadTypes = [...new Set(DATA.map(d => d.lead))];
const leadChipsEl = document.getElementById('leadChips');
let activeLead = '';
const allChip = document.createElement('button');
allChip.className = 'chip active';
allChip.textContent = 'All';
allChip.addEventListener('click', () => { activeLead = ''; setActiveChip(allChip); filterGrid(); });
leadChipsEl.appendChild(allChip);
function setActiveChip(el){
  leadChipsEl.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
}
leadTypes.forEach(lead => {
  const chip = document.createElement('button');
  chip.className = 'chip';
  chip.textContent = lead;
  chip.addEventListener('click', () => { activeLead = lead; setActiveChip(chip); filterGrid(); });
  leadChipsEl.appendChild(chip);
});

const books = [...new Set(DATA.map(d => d.book))];
const bookSelect = document.getElementById('bookFilter');
books.forEach(b => {
  const opt = document.createElement('option');
  opt.value = b; opt.textContent = b;
  bookSelect.appendChild(opt);
});
bookSelect.addEventListener('change', filterGrid);
document.getElementById('search').addEventListener('input', filterGrid);

function filterGrid(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const book = bookSelect.value;
  const results = DATA.filter(d => {
    const matchesQ = !q || d.text.toLowerCase().includes(q) || d.ref.toLowerCase().includes(q) || d.lead.toLowerCase().includes(q);
    const matchesLead = !activeLead || d.lead === activeLead;
    const matchesBook = !book || d.book === book;
    return matchesQ && matchesLead && matchesBook;
  });
  const grid = document.getElementById('grid');
  document.getElementById('resultCount').textContent = results.length + (results.length === 1 ? ' truth' : ' truths');
  if(results.length === 0){
    grid.innerHTML = '<div class="empty-state">Nothing matches that search. Try a different word or clear the filters.</div>';
    return;
  }
  grid.innerHTML = results.map(d => `
    <div class="card">
      <span class="lead-tag">${d.lead}</span>
      <p class="stmt">${d.text}</p>
      <p class="ref">${d.ref}</p>
    </div>
  `).join('');
}

/* ---------- TODAY ---------- */
function dayHash(){
  const d = new Date();
  const key = d.getFullYear() + '-' + d.getMonth() + '-' + d.getDate();
  let hash = 0;
  for(let i = 0; i < key.length; i++){
    hash = (hash * 31 + key.charCodeAt(i)) >>> 0;
  }
  return hash % DATA.length;
}
function renderToday(){
  const item = DATA[dayHash()];
  renderCard(item, document.getElementById('todayLead'), document.getElementById('todayStmt'), document.getElementById('todayRef'));
  document.getElementById('todayDate').textContent = new Date().toLocaleDateString(undefined, { weekday:'long', year:'numeric', month:'long', day:'numeric' });
}

/* ---------- INIT ---------- */
renderMed();
filterGrid();
renderToday();
</script>
